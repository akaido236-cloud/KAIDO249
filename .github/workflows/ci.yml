name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Smoke test the CLI
        run: |
          node dist/cli.js status
          node dist/cli.js add-all-templates
          node dist/cli.js agents
          node dist/cli.js validate-command "npm run build"
          node dist/cli.js adapters
        env:
          KAIDO_AI_PROVIDER: mock
          KAIDO_DATA_DIR: 'null'

      - name: Refuse a dangerous command (must exit non-zero on the check itself)
        run: |
          if node dist/cli.js validate-command "rm -rf /" | grep -q "^ALLOWED"; then
            echo "FAIL: a destructive command was allowed"; exit 1
          fi
          echo "OK: destructive command refused"

      - name: Bridge end-to-end test
        run: node scripts/demo-bridge.mjs

name: Android APK

# Builds the KAIDO Android shell. Runs automatically when the Android project
# changes, and can be started by hand from the Actions tab — which is how you
# build from a phone without a PC.
on:
  workflow_dispatch:
    inputs:
      runtime_url:
        description: 'KAIDO runtime URL to bake into the APK (leave blank to ship inert)'
        required: false
        default: ''
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        run: |
          gradle --no-daemon assembleDebug \
            -PkaidoRuntimeUrl="${{ github.event.inputs.runtime_url }}"

      - name: Show what was produced
        working-directory: android
        run: find . -name '*.apk' -exec ls -lh {} \;

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaido-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
